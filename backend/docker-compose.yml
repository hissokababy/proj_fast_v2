
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: fast_easy_minio
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

volumes:
  minio_data:
