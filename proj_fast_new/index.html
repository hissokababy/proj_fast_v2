      </div>
      <div class="carouselCta"><a class="btn" data-i18n="teachersCta" href="#contacts"><span
            data-i18n="teachers.text_004"></span></a></div>
    </div>
  </section>
  <section class="section pale" id="achievements">
    <div class="container">
      <div class="sectionHead">
        <div class="kicker" data-i18n="resultsKicker"><span data-i18n="results.text_001"></span></div>
        <h2 data-i18n="resultsTitle"><span data-i18n="results.text_002"></span></h2>
        <p data-i18n="resultsText"><span data-i18n="results.text_003"></span></p>

  <section class="section pale" id="steps">

        <div class="kicker"><span data-i18n="steps.text_001"></span></div>

<!-- Реальные SVG-иконки соцсетей -->

          <a aria-label="Instagram" href="https://instagram.com/" rel="noopener" target="_blank">

            </svg>
          </a>

          <!-- YouTube -->
          <a aria-label="YouTube" href="https://youtube.com/" rel="noopener" target="_blank">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <h2><span data-i18n="contacts.text_002"></span></h2>
        <p class="contactText"><span data-i18n="contacts.text_003"></span></p>
        <div class="contactItem">
          <div class="contactIcon">✉</div>
          <div><strong><span data-i18n="contacts.text_004"></span></strong><small><span

        <div class="contactItem">
          <div class="contactIcon">⌖</div>
          <div><strong><span data-i18n="contacts.text_006"></span></strong><small><span

        </div>
        <div class="mapBlock">

            src="https://maps.google.com/maps?q=English%20language%20learning%20centre%20Tashkent%20Uzbekistan&amp;t=&amp;z=12&amp;ie=UTF8&amp;iwloc=&amp;output=embed"

            href="https://facebook.com/" rel="noopener" target="_blank">f</a><a aria-label="YouTube"
            href="https://youtube.com/" rel="noopener" target="_blank">▶</a></div>
      </div>
      <form class="formCard" id="leadForm">
        <h3><span data-i18n="contacts.text_010"></span></h3>
        <p><span data-i18n="contacts.text_011"></span></p>
        <div class="field"><label for="name"><span data-i18n="contacts.text_012"></span></label><input
            data-i18n-attr="placeholder:accessibility.attribute_033_placeholder" id="name" minlength="2" name="name"

        <div class="field"><label for="phone"><span data-i18n="contacts.text_013"></span></label><input
            data-i18n-attr="placeholder:accessibility.attribute_034_placeholder" id="phone" name="phone"
            placeholder="+998 __ ___ __ __" required="" type="tel" /></div><button class="btn" type="submit"><span
            data-i18n="contacts.text_014"></span></button>
        <div class="fineprint"><span data-i18n="contacts.text_015"></span></div>
        <div class="success" id="successMsg" role="status"><span data-i18n="contacts.text_016"></span></div>
